version: '3.8'

services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: danialuser
      POSTGRES_PASSWORD: danialpassword
      POSTGRES_DB: danialnetfood
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: DanialNetFood.Web/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DatabaseProvider=PostgreSQL
      - ConnectionStrings__DefaultConnection=Host=db;Database=danialnetfood;Username=danialuser;Password=danialpassword
    ports:
      - "5000:80"
    depends_on:
      - db

volumes:
  postgres_data:
